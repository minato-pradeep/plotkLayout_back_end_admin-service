# Application Configuration - Company Creation Prevention Settings
# This file contains settings to prevent API Data Collection Failure

# ============================================================================
# COMPANY CREATION SETTINGS
# ============================================================================

# Maximum number of retries for project creation
company.creation.max.retries=3

# Timeout for company-service API calls (milliseconds)
company.creation.timeout.ms=30000

# Enable/disable project creation verification
company.creation.verify.enabled=true

# Enable/disable audit logging
company.creation.audit.enabled=true

# ============================================================================
# RETRY STRATEGY
# ============================================================================

# Retry backoff strategy: LINEAR, EXPONENTIAL
company.creation.retry.strategy=EXPONENTIAL

# Initial backoff delay (milliseconds)
company.creation.retry.initial.delay=1000

# Maximum backoff delay (milliseconds)
company.creation.retry.max.delay=10000

# ============================================================================
# VALIDATION SETTINGS
# ============================================================================

# Enable pre-creation validation
company.creation.validate.pre=true

# Enable post-creation validation
company.creation.validate.post=true

# Validate company name length
company.creation.validate.name.min.length=3
company.creation.validate.name.max.length=255

# Validate email format
company.creation.validate.email.format=true

# ============================================================================
# MONITORING & ALERTING
# ============================================================================

# Enable health check endpoint
company.health.check.enabled=true

# Health check interval (seconds)
company.health.check.interval=300

# Alert on creation failure
company.creation.alert.on.failure=true

# Alert email recipients
company.creation.alert.recipients=admin@example.com,ops@example.com

# ============================================================================
# LOGGING SETTINGS
# ============================================================================

# Log level for company creation
logging.level.com.plotvista.admin.service.CompanyService=INFO

# Enable detailed logging
company.creation.detailed.logging=true

# Log request/response payloads
company.creation.log.payloads=true

# ============================================================================
# CIRCUIT BREAKER SETTINGS
# ============================================================================

# Enable circuit breaker for company-service calls
company.service.circuit.breaker.enabled=true

# Circuit breaker failure threshold (percentage)
company.service.circuit.breaker.failure.threshold=50

# Circuit breaker timeout (seconds)
company.service.circuit.breaker.timeout=60

# ============================================================================
# DATABASE SETTINGS
# ============================================================================

# Enable transaction rollback on failure
company.creation.transaction.rollback=true

# Connection pool size
spring.datasource.hikari.maximum-pool-size=20

# Connection timeout (milliseconds)
spring.datasource.hikari.connection-timeout=30000

# ============================================================================
# COMPANY SERVICE INTEGRATION
# ============================================================================

# Company service URL
company.service.url=http://localhost:8081

# Company service connection timeout (milliseconds)
company.service.connection.timeout=10000

# Company service read timeout (milliseconds)
company.service.read.timeout=30000

# ============================================================================
# FEATURE FLAGS
# ============================================================================

# Enable new company creation flow with prevention measures
feature.company.creation.enhanced=true

# Enable project verification
feature.project.verification=true

# Enable audit trail
feature.audit.trail=true

# Enable health checks
feature.health.checks=true

# ============================================================================
# PERFORMANCE SETTINGS
# ============================================================================

# Thread pool size for async operations
company.creation.thread.pool.size=10

# Queue size for async operations
company.creation.queue.size=100

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

# Require HTTPS for company-service calls
company.service.require.https=false

# Validate SSL certificates
company.service.validate.ssl=true

# ============================================================================
# BACKUP & RECOVERY
# ============================================================================

# Enable automatic backup before company creation
company.creation.backup.enabled=false

# Backup location
company.creation.backup.location=/backups

# Enable automatic recovery on failure
company.creation.recovery.enabled=true

# Recovery timeout (seconds)
company.creation.recovery.timeout=300
